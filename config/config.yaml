data_paths:
  raw_data: "data/raw/Fraud_Data.csv"
  processed_data: "data/processed/Fraud_Data_Processed.csv"
  imputed_data: "data/processed/imputed.csv"
  processed_dir: "data/processed"
  artifacts_dir: "artifacts"
  data_artifacts_dir: "artifacts/data"
  model_artifacts_dir: "artifacts/models"
  X_train: "artifacts/data/X_train.csv"
  X_test: "artifacts/data/X_test.csv"
  Y_train: "artifacts/data/Y_train.csv"
  Y_test: "artifacts/data/Y_test.csv"
  random_state: 42

# "user_id","signup_time","purchase_time","purchase_value","device_id","source","browser","sex","age","ip_address","class"

columns:
  target: "class"
  drop_columns: ["user_id"]
  critical_columns: ""
  outlier_columns: ["purchase_value", "age"]
  nominal_columns: ["source", "browser", "sex"]
  numeric_columns: ["purchase_value", "age", "ip_address", "time_to_purchase_secs", "purchase_hour", "purchase_day_of_week"]
  feature_columns:

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1-score"
    - "auc"
  cv_folds: 5
  random_state: 42

outlier_detection:
  outlier_columns: ""
  detection_method: "iqr"
  handling_method: "cap"
  z_score_threshold: 3.0

binning:
  age:
    splits: [0.0, 25.0, 35.0, 50.0, 200.0]
    labels: ["Young", "Adult", "Middle Age", "Senior"]
  purchase_value:
    splits: [0.0, 50.0, 150.0, 500.0, 100000.0]
    labels: ["Low", "Medium", "High", "Very High"]

scaling:
  method: "standard"
  columns: ["ip_address", "time_to_purchase_secs", "purchase_hour", "purchase_day_of_week"]

deployment:
  model_name: "fraud_detection_model"
  model_version: "1.0.0"
  api_endpoint: "/predict"
  batch_size: 1000

inference:
  model_name: "random_forest_cv_model"
  data_path: "artifacts/data/X_test.csv"
  sample_size: 100
  save_path: "artifacts/predictions/predictions.csv"
  batch_size: 1000
  return_proba: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"
  file: "pipeline.log"

mlflow:
  tracking_uri: "file:./mlruns"  # Local file-based tracking
  experiment_name: "E-Commerce Fraud Detection"
  model_registry_name: "fraud_detection"
  artifact_path: "model"
  run_name_prefix: "fd_run"
  tags:
    project: "e-commerce_fraud_detection"
    team: "ml_engineering"
    environment: "development"
  autolog: true

environment:
  experiment_name: "fraud_detection"

pipeline:
  data_pipeline_name: "data_pipeline"
  training_pipeline_name: "model_training_pipeline"
  deployment_pipeline_name: "model_deployment_pipeline"
  inference_pipeline_name: "inference_pipeline"
  enable_cache: false

training:
  # TimeSeriesSplit cross-validation
  time_series_split:
    n_splits: 5

  # Cost matrix for threshold optimisation
  cost_matrix:
    fp_cost: 5       # $ cost of flagging a legitimate transaction for review
    fn_cost: 100     # $ cost of missing a fraudulent transaction

  # Threshold sweep range (start, stop, step) — all inclusive on start, exclusive on stop
  threshold_range:
    start: 0.05
    stop: 0.96
    step: 0.01

  # Minimum acceptable test AUC-ROC (CI quality gate)
  min_auc_gate: 0.75

  #  Baseline model 
  logistic_regression:
    C: [0.01, 0.1, 1.0, 10.0]
    max_iter: 1000
    solver: "lbfgs"
    class_weight: "balanced"

  # Advanced model 
  lightgbm:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    # scale_pos_weight is computed automatically as neg/pos ratio

streaming:
  # Kafka connectivity
  kafka_bootstrap_servers: "localhost:9092"
  topic_purchases:   "purchases"
  topic_fraud_scores: "fraud_scores"
  consumer_group:    "fraud_inference_group"
  analytics_group:   "fraud_analytics_group"

  # Rolling window durations (seconds)
  window_1h_secs:  3600
  window_24h_secs: 86400

  # Producer settings
  raw_data_path: "data/raw/Fraud_Data.csv"
  delay_secs: 0.05        # seconds between published events (throttle)
  max_events: null        # null = replay entire file; set integer to cap

  # Analytics sink
  analytics_dir: "analytics"
  sqlite_db:     "analytics/fraud_analytics.db"
  alert_rate_threshold: 0.15    # flag an hour bucket if fraud rate exceeds 15%