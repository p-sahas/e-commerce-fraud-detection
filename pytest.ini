[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Custom markers
markers =
    spark: tests requiring a PySpark session (may be slow)
    kafka: tests requiring a running Kafka broker
    mlflow_server: tests requiring a live MLflow tracking server
    integration: end-to-end integration tests

# Don't show warnings from Spark/Java/MLflow internals
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pyspark
    ignore::UserWarning:mlflow
